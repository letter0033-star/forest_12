<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="version" content="2026-10-14">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="초등 1~2학년 강점 탐색과 생활·학습·독서 습관 자가점검">
<title>숲속 나 찾기 1·2학년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
[hidden]{display:none!important}
/* 1·2학년용: 큰 글자, 얼굴 3개 보기, 읽어 주기. 결과는 강점 → 습관 → 약속 → 내 생각 순 */
:root{
  --bg:#EEF4F2; --surface:#FFFFFF; --ink:#1F3A33; --muted:#5B7069; --line:#D3E0DB;
  --leaf:#3E8E5E; --sun:#D99A1E; --sky:#3A7CA5; --stream:#23908C; --star:#7563BE; --mount:#80684F;
  --soft:#E3EEEA;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12201C; --surface:#1A2C27; --ink:#E4EFEA; --muted:#9BB2A9; --line:#2B423A;
  --leaf:#6BC08B; --sun:#F0BE55; --sky:#79B4D8; --stream:#5CC6C1; --star:#AB9CF0; --mount:#C4A887;
  --soft:#203631; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12201C; --surface:#1A2C27; --ink:#E4EFEA; --muted:#9BB2A9; --line:#2B423A;
  --leaf:#6BC08B; --sun:#F0BE55; --sky:#79B4D8; --stream:#5CC6C1; --star:#AB9CF0; --mount:#C4A887;
  --soft:#203631; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;margin:0;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:28px max(56px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(30px,7.5vw,44px)}
h2{font-size:25px}
h3{font-size:20px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--display);color:var(--leaf);letter-spacing:.06em;font-size:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
button{font-family:var(--display);font-size:18px;cursor:pointer;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 18px;transition:transform .12s,border-color .12s,background .12s}
@media (hover:hover){button:hover{border-color:var(--leaf)}}
button,a,input,select,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.primary{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
@media (hover:hover){.primary:hover{filter:brightness(1.07)}}
.big{font-size:22px;padding:16px 28px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chip{display:flex;align-items:center;gap:8px;font-size:15px}
.ico{width:38px;height:38px;flex:none;display:inline-block}
.ico svg{width:100%;height:100%;display:block}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;font-family:var(--display);font-size:16px}
.legend span{display:flex;flex-direction:column;align-items:center;gap:4px}
.legend .face{width:44px;height:44px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border-radius:14px;padding:12px 14px}
.toggle b{font-family:var(--display);font-weight:400;font-size:18px}
.switch{position:relative;width:58px;height:34px;border-radius:99px;background:var(--line);border:0;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{left:28px}
/* quiz */
.progress{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qtext{font-family:var(--display);font-size:clamp(26px,6.6vw,34px);line-height:1.45;min-height:2.9em;text-wrap:balance;flex:1}
.speak{flex:none;width:52px;height:52px;padding:0;display:grid;place-items:center;border-radius:50%}
.speak svg{width:26px;height:26px}
.speak.on{border-color:var(--leaf);background:var(--soft)}
.qex{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:18px;line-height:1.6}
.qex b{font-family:var(--display);font-weight:400;color:var(--muted);font-size:15px}
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.answers button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 4px 14px;font-size:18px;line-height:1.3}
.answers button .face{width:58px;height:58px}
.answers button.sel{background:var(--soft);border-color:var(--leaf)}
.answers button:active{transform:scale(.96)}
.face svg{width:100%;height:100%;display:block}
@media (max-width:520px){.chars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:360px){.answers button{font-size:16px}.answers button .face{width:50px;height:50px}}
@media (hover:none) and (pointer:coarse){.kbhint{display:none}}
.inapp{background:var(--soft);border:1.5px solid var(--sun);border-radius:14px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
/* results */
.hero{display:flex;flex-direction:column;gap:16px}
.toptwo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.toptwo{grid-template-columns:1fr}}
.top{border-radius:20px;padding:18px;border:2px solid var(--c);background:var(--surface);display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.top .ico{width:58px;height:58px;color:var(--c)}
.top h3{color:var(--c)}
.top .tip{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:16px}
.leaves{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:center;font-size:16px}
.lrow .name{display:flex;align-items:center;gap:6px;font-family:var(--display)}
.lrow .name .ico{width:26px;height:26px;color:var(--c)}
.lrow .dots{display:flex;gap:6px}
.lrow .dots i{width:20px;height:20px;border-radius:50% 0 50% 0;background:var(--soft);border:1.5px solid var(--c)}
.lrow .dots i.on{background:var(--c)}
.habits{display:flex;flex-direction:column;gap:14px}
.habit{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.habit:first-child{border-top:0;padding-top:0}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--display);font-size:15px;padding:3px 12px;border-radius:99px;border:1.5px solid currentColor}
.lv3{color:var(--leaf)} .lv2{color:var(--sun)} .lv1{color:var(--sky)}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 12px;font-size:16px;margin:0}
.kv dt{font-family:var(--display);color:var(--muted)}
.kv dd{margin:0}
.promise{display:flex;flex-direction:column;gap:8px}
.promise button{text-align:left;font-family:var(--body);font-size:17px;display:flex;gap:10px;align-items:center}
.promise button .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:16px;line-height:1}
.promise button.sel{border-color:var(--leaf);background:var(--soft)}
.promise button.sel .box{border-color:var(--leaf);background:var(--leaf);color:var(--surface)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
textarea.open{font-family:var(--body);font-size:18px;width:100%;min-height:90px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;line-height:1.6}
.oq{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.oq:first-of-type{border-top:0;padding-top:0}
.oq label{font-family:var(--display);font-size:21px;line-height:1.45}
.oans{display:flex;flex-direction:column;gap:12px}
.oans h3{font-size:18px}
.oans p{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:10px 14px}
.whof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.whof label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:16px;color:var(--muted)}
.whof .nmf{grid-column:1/-1}
.whof input,.whof select{font-family:var(--body);font-size:18px;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 22px}
summary{font-family:var(--display);font-size:18px;cursor:pointer}
details ul{padding-left:20px;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.note{font-size:13px;color:var(--muted);text-align:center}
.toast{font-size:15px;color:var(--leaf)}
.tlab{font-family:var(--display);font-size:15px;color:var(--muted);display:block}
.otitle{font-family:var(--body);font-size:17px;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.btitle{font-family:var(--display);font-size:18px}
.oans p.btitle{background:none;padding:0 0 2px}
.print-only{display:none}
.phead{border-bottom:2px solid var(--ink);padding-bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;font-size:11pt}
.phead .who span{display:inline-block;min-width:3.2em;border-bottom:1px solid var(--ink);margin:0 4px;text-align:center}
.phead .who span.nm{min-width:7em}
.pbox{border:1px dashed var(--line);border-radius:10px;min-height:3.2cm}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ntc{position:fixed;inset:0;background:rgba(12,28,23,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:50}
.ntcbox{background:var(--surface);color:var(--ink);border-radius:20px;max-width:520px;width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;-webkit-overflow-scrolling:touch;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.ntcbox ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.ntcbox .warn{background:var(--soft);border:1.5px solid var(--sun);border-radius:12px;padding:10px 12px;font-size:15px}
.ntcbox .primary{align-self:stretch;font-size:19px;padding:14px;position:sticky;bottom:0;box-shadow:0 -14px 14px -2px var(--surface);flex:none}
@media (max-height:740px){.ntcbox{padding:16px 18px;gap:8px;font-size:15px;line-height:1.55}.ntcbox h2{font-size:21px}.ntcbox ul{gap:5px}.ntcbox .warn{font-size:14px;padding:8px 10px}}
.ntchead{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media print{.ntc{display:none!important}}
@media print{
  :root:not([data-theme="none"]){--bg:#fff;--surface:#fff;--ink:#1F3A33;--muted:#4F625C;--line:#B9C9C3;--leaf:#3E8E5E;--sun:#C1860F;--sky:#3A7CA5;--stream:#23908C;--star:#7563BE;--mount:#80684F;--soft:#EEF4F1;color-scheme:light}
  @page{size:A4;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:11.5pt;line-height:1.55}
  .wrap{max-width:none;padding:0;gap:10px}
  h1{font-size:22pt} h2{font-size:15pt} h3{font-size:13pt}
  .panel,.top{padding:12px 14px;border-radius:10px}
  .panel,.habits,.oans,.leaves{display:block}
  .panel>*+*,.habits>*+*,.oans>*+*,.leaves>*+*{margin-top:9px}
  .habit{display:block}
  .habit>*+*{margin-top:6px}
  .top,.habit,.leaves,.oans>div,.plist{break-inside:avoid}
  h2,.hhead{break-after:avoid}
  .no-print,button,details,.toast,#fallback{display:none!important}
  .print-only{display:block!important}
  .phead.print-only{display:flex!important}
  .toptwo{grid-template-columns:1fr 1fr!important}
}
/* ── 개선판 추가 스타일 ── */
.restore{background:var(--soft);border:1.5px solid var(--leaf);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.restore .row button{padding:8px 14px;font-size:15px}
.qtools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.navbtn{font-size:14px;padding:6px 12px;border-radius:10px}
.qnav{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:var(--soft);border-radius:14px}
.qnav .grp{width:100%;font-family:var(--display);font-size:13px;color:var(--muted)}
.qnav .grp+.grp,.qnav .nd+.grp{margin-top:6px}
.nd{width:36px;height:36px;padding:0;font-family:var(--body);font-size:13px;border-radius:10px;font-variant-numeric:tabular-nums;border-width:1.5px}
.nd.done{background:var(--surface);border-color:var(--leaf);color:var(--ink)}
.nd.h.done{border-color:var(--sky)}
.nd.cur{outline:3px solid var(--sun);outline-offset:1px}
.nd:disabled{opacity:.35;cursor:default}
.gloss{font-size:14px;line-height:1.55;border-left:3px solid var(--sun);padding:6px 12px;background:var(--surface);border-radius:0 10px 10px 0}
.gloss b{font-family:var(--display);font-weight:400}
.bridge{align-items:flex-start}
.bridge .icons{display:flex;gap:6px}
.bridge .icons .ico{width:30px;height:30px}
.scalechips{display:flex;flex-wrap:wrap;gap:8px}
.scalechips span{border:1.5px solid var(--sky);border-radius:99px;padding:4px 12px;font-size:15px}
.chips{display:flex;flex-direction:column;gap:6px}
.chips .ct{font-family:var(--display);font-size:14px;color:var(--muted)}
.chips .cl{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{font-family:var(--body);font-size:15px;padding:7px 12px;border-radius:99px;border-width:1.5px;line-height:1.35}
.chipbtn::before{content:"+ ";color:var(--leaf);font-family:var(--display)}
.voice{font-size:14px;color:var(--muted)}
.wdots{display:flex;gap:6px}
.wdots button{width:34px;height:34px;padding:0;font-size:14px;border-radius:50%;font-family:var(--body);border-width:1.5px}
.wdots button.done{border-color:var(--leaf)}
.wdots button.cur{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.forest{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:center}
@media (max-width:580px){.forest{grid-template-columns:1fr}}
.radar svg{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week div{border:1.5px solid var(--line);border-radius:10px;text-align:center;padding:4px 0 6px;font-family:var(--display);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.week svg{width:28px;height:28px}
.imgprev{display:flex;flex-direction:column;gap:8px}
.imgprev img{border-radius:12px;border:1px solid var(--line);max-width:min(100%,360px)}
.codebox{font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:14px;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);word-break:break-all}
details.inner{background:var(--soft);border:0;padding:12px 16px}
details.inner summary{font-size:16px}
.linkbtn{background:none;border:0;padding:4px 0;font-family:var(--body);font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
/* 교사용 */
.tpaste{font-family:ui-monospace,Consolas,monospace;font-size:13px;width:100%;min-height:150px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.tgrid{grid-template-columns:1fr}}
.tcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tcard h3{font-size:16px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}
.tlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.tlegend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ttable{border-collapse:collapse;font-size:14px;width:100%;min-width:560px}
.ttable th,.ttable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.ttable th{font-family:var(--display);font-weight:400;color:var(--muted)}
.ilist{display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 90px 36px;gap:10px;align-items:center;font-size:14px}
.irow .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.irow .track i{display:block;height:100%;background:var(--sky)}
.irow.low .track i{background:var(--sun)}
.irow.low span:first-child{font-weight:700}
.irow .num{text-align:right;color:var(--muted)}
@media print{
  .restore,.qnav{display:none!important}
  .forest{grid-template-columns:42% 1fr!important;gap:12px}
  .radar svg{max-width:62mm}
  .week svg{width:20px;height:20px}
  body[data-print="compact"] .full-only{display:none!important}
  body[data-print="compact"]{font-size:10pt;line-height:1.45}
  body[data-print="compact"] .wrap{gap:7px}
  body[data-print="compact"] h1{font-size:17pt}
  body[data-print="compact"] h2{font-size:12.5pt}
  body[data-print="compact"] h3{font-size:11pt}
  body[data-print="compact"] .panel,body[data-print="compact"] .top{padding:8px 12px}
  body[data-print="compact"] .panel>*+*{margin-top:6px}
  body[data-print="compact"] .top .ico{width:32px;height:32px}
  body[data-print="compact"] .top p{font-size:9.5pt}
  body[data-print="compact"] .radar svg{max-width:52mm}
  body[data-print="compact"] .bar{font-size:9.5pt;gap:6px}
  body[data-print="compact"] .bar .track{height:10px}
  body[data-print="compact"] .bars{gap:5px}
  body[data-print="compact"] .kv{font-size:9.5pt}
  body[data-print="compact"] .via{font-size:9.5pt}
  body[data-print="compact"] .habit>*+*{margin-top:3px}
  body[data-print="compact"] .habits>*+*{margin-top:6px}
  body[data-print="compact"] .habit{padding-top:6px}
  body[data-print="compact"] .muted.small{font-size:8.5pt}
}
/* 1·2학년판 보충 */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:15px}
.bar .name{display:flex;align-items:center;gap:6px}
.bar .name .ico{width:24px;height:24px;color:var(--c)}
.bar .track{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.cnt{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.nd{width:42px;height:42px;font-size:15px}
.navbtn{font-size:15px;padding:8px 14px}

}

}

/* 휴대폰 뒤로가기: 페이지를 떠나지 않고 이전 단계로 */
function trap(){try{history.pushState({forest:1},'');}catch(e){}}
window.addEventListener('popstate',()=>{
  const s=state.step;
  if(s==='intro') return;
  if(s==='quiz'){ if(state.i>0) state.i--; else state.step='intro'; }
  else if(s==='bridge'){ state.step='quiz'; state.i=NSTR-1; }
  else if(s==='check'){ state.step='quiz'; state.i=Q.length-1; }
  else if(s==='write'){ if(state.w>0) state.w--; else { state.step='quiz'; state.i=Q.length-1; } }
  else if(s==='result'){ state.step='write'; state.w=OPEN.length-1; }
  else if(s==='teacher'){ state.step=state._from&&state._from!=='teacher'?state._from:'intro'; }
  render(); window.scrollTo(0,0);
  if(state.step!=='intro') trap();
});
let lastTap=0;
function firstUnanswered(){return state.ans.findIndex(v=>!v);}
function straight(ans){const c=[0,0,0,0];ans.forEach(v=>c[v]++);const m=Math.max(c[1],c[2],c[3]);return {hit:m>=19,n:m,v:c.indexOf(m)};}

function score(ans){
  const s={};ORDER.forEach(k=>s[k]=0);
  const items={life:[],study:[],read:[]};
  Q.forEach((q,i)=>{if(CH[q[0]]) s[q[0]]+=ans[i]; else items[q[0]].push({text:q[1],tip:q[3],v:ans[i]});});
  const ranked=ORDER.map((k,idx)=>({k,v:s[k],idx})).sort((a,b)=>b.v-a.v||a.idx-b.idx);
  const top=ranked.slice(0,2);
  const alsoTied=ranked.slice(2).filter(r=>r.v===top[1].v).map(r=>r.k);
  const habits={};
  Object.keys(items).forEach(a=>{
    const arr=items[a];const avg=arr.reduce((t,x)=>t+x.v,0)/arr.length;
    let best=arr[0];arr.forEach(x=>{if(x.v>best.v)best=x;});
    if(best.v<3)best=null;
    let low=null;arr.forEach(x=>{if(x===best)return;if(!low||x.v<low.v)low=x;});
    if(low&&low.v>2)low=null;
    habits[a]={avg,best,low,level:avg>=2.5?3:avg>=1.75?2:1,first:arr[0]};
  });
  return {s,ranked,top,alsoTied,habits};
}
// 약속 후보: 영역마다 "해 볼 일"(없으면 그 영역 첫 문항의 제안)
function promiseOptions(r){

function render(){
  const s=state.step;
  if(s!=='quiz'&&s!=='bridge') hush();
  if(s==='intro') intro();
  else if(s==='quiz') quiz();
  else if(s==='bridge') bridge();
  else if(s==='check') check();
  else if(s==='write') write();
  else if(s==='teacher') teacher();
  else result();
  if(restored&&s!=='intro'&&s!=='teacher'){
    app.insertAdjacentHTML('afterbegin',`<div class="restore no-print" role="status"><span>하던 곳부터 이어서 할 수 있어요.</span><div class="row"><button id="rsKeep">이어서 할래요</button><button id="rsNew">처음부터 할래요</button></div></div>`);
    document.getElementById('rsKeep').onclick=()=>{restored=false;document.querySelector('.restore').remove();};
    document.getElementById('rsNew').onclick=reset;
  }
  bindInapp();
  save();
}

  app.querySelectorAll('.answers button').forEach(b=>b.onclick=()=>{const t=Date.now();if(t-lastTap<350)return;lastTap=t;pick(+b.dataset.v);});

}
function goBack(){if(state.i>0){state.i--;render();window.scrollTo(0,0);}}
function pick(v){state.ans[state.i]=v;advance();}
function advance(){
  const i=state.i;
  if(i===NSTR-1&&!state.ans[NSTR]) state.step='bridge';
  else if(i<Q.length-1) state.i=i+1;
  else finishQuiz();
  render();window.scrollTo(0,0);
}
function resume(){const f=firstUnanswered();if(f!==-1)state.i=f;else finishQuiz();render();window.scrollTo(0,0);}
function finishQuiz(){
  const f=firstUnanswered();
  if(f!==-1){state.i=f;return;}
  if(!state.nudged&&straight(state.ans).hit){state.nudged=true;state.step='check';return;}
  state.step='write';state.w=0;
}
document.addEventListener('keydown',e=>{
  if(state.step!=='quiz')return;
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(['1','2','3'].includes(e.key)){e.preventDefault();pick(+e.key);}
  else if(e.key==='Backspace'){e.preventDefault();goBack();}
});

function radarSVG(s,max,fmt){
  const W=340,H=300,cx=170,cy=152,R=98;
  const pt=(idx,r)=>{const a=(-90+60*idx)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const poly=r=>ORDER.map((_,idx)=>pt(idx,r).map(n=>n.toFixed(1)).join(',')).join(' ');
  let g='';
  for(let v=1;v<=max;v++){g+=`<polygon points="${poly(R*v/max)}" style="fill:none;stroke:var(--line);stroke-width:${v===max?1.5:1}"/>`;}
  ORDER.forEach((_,idx)=>{const [x,y]=pt(idx,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)"/>`;});
  const dp=ORDER.map((k,idx)=>pt(idx,R*s[k]/max));
  g+=`<polygon points="${dp.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" style="fill:var(--leaf);fill-opacity:.22;stroke:var(--leaf);stroke-width:2.5;stroke-linejoin:round"/>`;
  ORDER.forEach((k,idx)=>{const [x,y]=dp[idx];g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" style="fill:${HEX[k]};stroke:var(--surface);stroke-width:1.5"/>`;});
  ORDER.forEach((k,idx)=>{
    const [x,y]=pt(idx,R+20);const c=Math.cos((-90+60*idx)*Math.PI/180);
    const anc=Math.abs(c)<.1?'middle':c>0?'start':'end';
    const dy=idx===0?-8:idx===3?14:4;
    g+=`<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anc}" style="fill:var(--ink);font-family:var(--display);font-size:16px">${CH[k].name}${fmt?` <tspan style="fill:var(--muted);font-family:var(--body);font-size:12px">${fmt(s[k])}</tspan>`:''}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="나의 숲 모양: ${ORDER.map(k=>CH[k].name+' '+(fmt?fmt(s[k]):s[k])).join(', ')}">${g}</svg>`;
}

function result(){

// ── 결과 카드 이미지 (Canvas) ──
function iconImg(k,hex){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ICONS[k].replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" ').replace(/currentColor/g,hex));});}
function wrapLines(ctx,text,maxW){
  const words=String(text).split(/\s+/).filter(Boolean);const lines=[];let cur='';
  const push=w=>{if(ctx.measureText(w).width<=maxW){cur=w;return;}let part='';for(const ch of w){if(ctx.measureText(part+ch).width>maxW){lines.push(part);part=ch;}else part+=ch;}cur=part;};
  words.forEach(w=>{const t=cur?cur+' '+w:w;if(ctx.measureText(t).width<=maxW)cur=t;else{if(cur)lines.push(cur);push(w);}});
  if(cur)lines.push(cur);return lines;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function leafPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s);c.bezierCurveTo(x,y+s*.35,x+s*.35,y,x+s,y);c.bezierCurveTo(x+s,y+s*.65,x+s*.65,y+s,x,y+s);c.closePath();}
async function makeCard(r,leafN){

  c.fillStyle='#EEF4F2';c.fillRect(0,0,W,H);

  const X=104,MW=W-208;let y=140;
  c.fillStyle=HEX.tree;c.font='36px '+D;c.fillText('숲속 나 찾기 · 1·2학년',X,y);
  c.fillStyle=MU;c.font='28px '+B;c.textAlign='right';c.fillText(today(),W-X,y);c.textAlign='left';
  const w=state.who;const whoTxt=[w.g&&w.g+'학년',w.c&&w.c+'반',w.n&&w.n+'번',w.name].filter(Boolean).join(' ');
  y+=64;if(whoTxt){c.fillStyle=MU;c.font='32px '+B;c.fillText(whoTxt,X,y);y+=24;}
  const head=`${w.name?w.name+nameJosa(w.name):'나는'} ${CH[t[0]].name} 친구를 닮았어요!`;
  c.fillStyle=INK;let hf=66;c.font=hf+'px '+D;let hl=wrapLines(c,head,MW);if(hl.length>2){hf=54;c.font=hf+'px '+D;hl=wrapLines(c,head,MW);}
  hl.forEach(l=>{y+=hf+16;c.fillText(l,X,y);});
  y+=40;
  const bw=(MW-28)/2,bh=200;
  t.forEach((k,idx)=>{
    const bx=X+idx*(bw+28);
    c.strokeStyle=HEX[k];c.lineWidth=5;rr(c,bx,y,bw,bh,28);c.stroke();
    if(icons[idx])c.drawImage(icons[idx],bx+28,y+28,96,96);
    c.fillStyle=HEX[k];c.font='48px '+D;c.fillText(CH[k].name,bx+140,y+76);
    c.fillStyle=MU;c.font='30px '+B;c.fillText(CH[k].trait,bx+140,y+118);
    for(let n=0;n<5;n++){leafPath(c,bx+28+n*44,y+148,30);c.fillStyle=n<leafN[k]?HEX[k]:'#FFFFFF';c.fill();c.strokeStyle=HEX[k];c.lineWidth=2.5;c.stroke();}
  });
  y+=bh+40;
  const cx=X+170,cy=y+160,R=118;
  const pt=(i,rad)=>{const a=(-90+60*i)*Math.PI/180;return [cx+rad*Math.cos(a),cy+rad*Math.sin(a)];};
  c.lineWidth=2;c.strokeStyle=LINE;
  for(let v=1;v<=5;v++){c.beginPath();ORDER.forEach((_,i)=>{const [px,py]=pt(i,R*v/5);i?c.lineTo(px,py):c.moveTo(px,py);});c.closePath();c.stroke();}
  c.beginPath();ORDER.forEach((k,i)=>{const [px,py]=pt(i,R*leafN[k]/5);i?c.lineTo(px,py):c.moveTo(px,py);});c.closePath();
  c.fillStyle='rgba(62,142,94,.22)';c.fill();c.strokeStyle=HEX.tree;c.lineWidth=5;c.stroke();
  ORDER.forEach((k,i)=>{const [px,py]=pt(i,R*leafN[k]/5);c.beginPath();c.arc(px,py,9,0,Math.PI*2);c.fillStyle=HEX[k];c.fill();});
  c.font='26px '+D;c.fillStyle=INK;
  ORDER.forEach((k,i)=>{const [px,py]=pt(i,R+30);const co=Math.cos((-90+60*i)*Math.PI/180);c.textAlign=Math.abs(co)<.1?'center':co>0?'left':'right';c.fillText(CH[k].name,px,py+(i===0?-4:i===3?22:9));});
  c.textAlign='left';
  const hx=X+400;let hy=y+40;
  c.fillStyle=MU;c.font='30px '+D;c.fillText('나의 습관',hx,hy);hy+=30;
  Object.keys(AREAS).forEach(a=>{
    const h=r.habits[a];const col=h.level===3?HEX.tree:h.level===2?'#C1860F':HEX.wind;
    c.fillStyle=SOFT;rr(c,hx,hy,W-X-hx,76,20);c.fill();
    c.fillStyle=INK;c.font='32px '+D;c.fillText(AREAS[a].name,hx+24,hy+50);
    c.fillStyle=col;c.textAlign='right';c.fillText(LVT[h.level],W-X-24,hy+50);c.textAlign='left';
    hy+=92;
  });
  y+=360;
  const boxB=H-128;const pr=state.promise;
  c.font='34px '+B;let pl=wrapLines(c,pr||'이번 주 약속을 골라 보세요.',MW-64);
  const maxL=Math.max(1,Math.floor((boxB-y-112)/48)+1);if(pl.length>maxL){pl=pl.slice(0,maxL);pl[maxL-1]=pl[maxL-1].replace(/.$/,'…');}
  c.fillStyle=SOFT;rr(c,X,y,MW,boxB-y,28);c.fill();
  c.fillStyle=HEX.tree;c.font='34px '+D;c.fillText('이번 주 나의 약속',X+32,y+58);
  c.fillStyle=pr?INK:MU;c.font='34px '+B;
  let py=y+58;pl.forEach(l=>{py+=50;c.fillText(l,X+32,py);});
  c.fillStyle=MU;c.font='22px '+B;c.textAlign='center';c.fillText('학생 자기성찰용 자체 제작 도구 · 진단 도구가 아닙니다 · '+VERSION,W/2,H-82);c.textAlign='left';
  return cv;
}

// ── 교사용: 학급 결과 모아보기 (기기 안에서만 계산) ──
let teacherText='';
function openTeacher(){hush();state._from=state.step==='teacher'?'intro':state.step;state.step='teacher';trap();render();window.scrollTo(0,0);}
const REC=/FOREST12\|([^|\r\n]*)\|([^|\r\n]*)\|([^|\r\n]*)\|([^|\r\n]*)\|([1-3]{21})(?![0-9])/g;
function parseRecords(text){
  const map=new Map();let total=0;
  for(const m of String(text).matchAll(REC)){
    total++;
    const [,g,c,n,name,digits]=m;
    const key=[g,c,n,name].map(x=>x.trim()).join('|');
    map.delete(key);
    map.set(key,{g:g.trim(),c:c.trim(),n:n.trim(),name:name.trim(),ans:digits.split('').map(Number)});
  }
  const list=[...map.values()];
  list.forEach(x=>x.r=score(x.ans));
  list.sort((a,b)=>(+a.g||0)-(+b.g||0)||(+a.c||0)-(+b.c||0)||(+a.n||999)-(+b.n||999)||a.name.localeCompare(b.name,'ko'));
  const other=(String(text).match(/FOREST\|/g)||[]).length;
  return {list,total,dup:total-list.length,other};
}
function classStats(list){
  const N=list.length;
  const avg={},top={};ORDER.forEach(k=>{avg[k]=list.reduce((t,x)=>t+x.r.s[k],0)/N;top[k]=list.filter(x=>x.r.top.some(y=>y.k===k)).length;});
  const lv={};Object.keys(AREAS).forEach(a=>{lv[a]={1:0,2:0,3:0};list.forEach(x=>lv[a][x.r.habits[a].level]++);});
  const items=[];for(let i=NSTR;i<Q.length;i++)items.push({i,text:Q[i][1],avg:list.reduce((t,x)=>t+x.ans[i],0)/N});
  const lows=items.slice().sort((a,b)=>a.avg-b.avg||a.i-b.i).slice(0,3).map(x=>x.i);
  return {N,avg,top,lv,items,lows};
}
function tsv(list){
  const head=['학년','반','번호','이름','닮은친구1','닮은친구2',...ORDER.map(k=>CH[k].name),'생활평균','학습평균','독서평균',...Q.map((_,i)=>'문항'+(i+1))];
  const rows=list.map(x=>[x.g,x.c,x.n,x.name,CH[x.r.top[0].k].name,CH[x.r.top[1].k].name,...ORDER.map(k=>x.r.s[k]),...Object.keys(AREAS).map(a=>x.r.habits[a].avg.toFixed(2)),...x.ans]);
  return [head,...rows].map(r=>r.join('\t')).join('\n');
}
function teacher(){
  const P=parseRecords(teacherText);const L=P.list;
  let body='';
  if(L.length){
    const S=classStats(L);
    body=`
    <div class="panel">
      <h2>우리 반 숲 지도 <span class="muted small">${S.N}명</span></h2>
      <p class="muted small" id="tinfo">인식한 기록 ${P.total}줄${P.dup?` · 같은 학생의 중복 ${P.dup}줄은 마지막 것만 썼어요`:''}${P.other?` · 3~6학년판 기록 ${P.other}줄은 제외했어요`:''}</p>
      <div class="forest">
        <div class="radar">${radarSVG(Object.fromEntries(ORDER.map(k=>[k,Math.round(S.avg[k]*10)/10])),6,v=>v.toFixed(1))}</div>
        <div class="bars">${ORDER.map(k=>`
          <div class="bar" style="--c:${CH[k].c}">
            <span class="name">${ico(k)}${CH[k].name}</span>
            <span class="track"><i style="width:${(S.top[k]/S.N*100).toFixed(1)}%"></i></span>
            <span class="num">${S.top[k]}명</span>
          </div>`).join('')}</div>
      </div>
      <p class="muted small">왼쪽 육각형은 강점별 학급 평균 점수(2~6점), 오른쪽 막대는 그 강점이 닮은 친구(1·2위)로 나온 학생 수예요. 동점 처리 규칙 때문에 앞쪽 강점(나무·햇살)이 조금 더 많이 잡힐 수 있어요.</p>
    </div>
    <div class="panel">
      <h2>습관 단계 분포</h2>
      <div class="tgrid">${Object.keys(AREAS).map(a=>{const d=S.lv[a];return `<div class="tcard"><h3>${AREAS[a].name}</h3>
        <div class="stack" role="img" aria-label="튼튼해요 ${d[3]}명, 자라고 있어요 ${d[2]}명, 새싹이에요 ${d[1]}명">${[[3,'var(--leaf)'],[2,'var(--sun)'],[1,'var(--sky)']].map(([l,col])=>d[l]?`<i style="width:${d[l]/S.N*100}%;background:${col}"></i>`:'').join('')}</div>
        <div class="tlegend"><span><b style="background:var(--leaf)"></b>튼튼 ${d[3]}</span><span><b style="background:var(--sun)"></b>자라는 중 ${d[2]}</span><span><b style="background:var(--sky)"></b>새싹 ${d[1]}</span></div></div>`;}).join('')}</div>
    </div>
    <div class="panel">
      <h2>습관 문항별 평균 <span class="muted small">1~3점</span></h2>
      <p class="muted small">노란색 3문항은 학급 평균이 가장 낮은 문항이에요. 학급이 함께 키울 습관을 정할 때 참고하세요.</p>
      <div class="ilist">${S.items.map(x=>`<div class="irow${S.lows.includes(x.i)?' low':''}"><span>${x.i+1}. ${esc(x.text)}</span><span class="track"><i style="width:${(x.avg/3*100).toFixed(1)}%"></i></span><span class="num">${x.avg.toFixed(1)}</span></div>`).join('')}</div>
    </div>
    <div class="panel">
      <div class="hhead"><h2>학생별 결과</h2><button id="tcopy">표로 복사 (시트·엑셀)</button></div>
      <span class="toast" id="ttoast" role="status"></span>
      <div class="tscroll"><table class="ttable"><thead><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th><th>닮은 친구</th><th>생활</th><th>학습</th><th>독서</th></tr></thead><tbody>
      ${L.map(x=>`<tr><td>${esc(x.g)}</td><td>${esc(x.c)}</td><td>${esc(x.n)}</td><td>${esc(x.name)}</td><td>${CH[x.r.top[0].k].name}·${CH[x.r.top[1].k].name}</td>${Object.keys(AREAS).map(a=>`<td><span class="pill lv${x.r.habits[a].level}">${LVT[x.r.habits[a].level]}</span></td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <textarea id="tfb" class="tpaste" hidden readonly></textarea>
    </div>`;
  }else if(teacherText.trim()){
    const P2=parseRecords(teacherText);
    body=`<div class="panel"><p>붙여 넣은 글에서 1·2학년판 기록 줄을 찾지 못했어요. 학생 결과 화면의 "선생님께 결과 보내기"에 있는 <b>FOREST12|</b>로 시작하는 줄을 그대로 붙여 넣어 주세요.${P2.other?` (3~6학년판 기록 줄 ${P2.other}개가 보여요. 그 줄은 3~6학년판의 "학급 결과 모아보기"에 붙여 넣어 주세요.)`:''}</p></div>`;
  }
  app.innerHTML=`
  <div class="hero">
    <p class="eyebrow">선생님용 · 1·2학년</p>
    <h1>학급 결과 모아보기</h1>
    <p>학생들이 보낸 기록 줄(FOREST12|…)을 아래 칸에 한꺼번에 붙여 넣으세요. 메신저 글을 통째로 붙여 넣어도 기록 줄만 골라 읽어요. 모든 계산은 이 기기 안에서만 하고, 붙여 넣은 내용은 저장하지 않아요.</p>
  </div>
  <div class="panel">
    <label for="tpaste" class="tlab">기록 줄 붙여 넣기</label>
    <textarea id="tpaste" class="tpaste" placeholder="FOREST12|1|2|15|홍길동|332132...">${esc(teacherText)}</textarea>
    <div class="row" style="justify-content:space-between">
      <button id="tback">학생 화면으로</button>
      <div class="row"><button id="tclear">지우기</button><button class="primary" id="trun">모아보기</button></div>
    </div>
  </div>
  ${body}
  <p class="note">학급 통계는 대화와 학급 운영을 돕는 참고 자료이며, 학생 평가나 기록 자료가 아닙니다. · ${VERSION}</p>`;
  const ta=document.getElementById('tpaste');ta.oninput=()=>{teacherText=ta.value;};
  document.getElementById('trun').onclick=()=>{teacherText=ta.value;render();};
  document.getElementById('tclear').onclick=()=>{teacherText='';render();};
  document.getElementById('tback').onclick=()=>{state.step=state._from&&state._from!=='teacher'?state._from:'intro';render();window.scrollTo(0,0);};
  const tc=document.getElementById('tcopy');
  if(tc)tc.onclick=()=>{const txt=tsv(L);const tt=document.getElementById('ttoast');const fb=()=>{const f=document.getElementById('tfb');f.value=txt;f.hidden=false;f.focus();f.select();tt.textContent='아래 표를 복사해 붙여 넣으세요';};try{navigator.clipboard.writeText(txt).then(()=>{tt.textContent=`${L.length}명 표를 복사했어요. 시트의 A1 칸에 붙여 넣으세요`;},fb);}catch(e){fb();}};
}

// 접속 안내 팝업: 처음 열 때 한 번(새로고침으로 이어 하는 경우는 생략)
function notice(){
  const d=document.createElement('div');
  d.className='ntc';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','ntcT');
  d.innerHTML=`<div class="ntcbox">
    <div class="ntchead"><h2 id="ntcT">시작하기 전에 알아 두어요</h2>${TTS?`<button class="speak" id="ntcSay" aria-label="안내 듣기">${SPEAKER}</button>`:''}</div>
    <ul>
      <li><b>시험이 아니에요.</b> 정답도 없어요.</li>
      <li>나와 비슷한 <b>얼굴</b>을 누르면 돼요.</li>
      <li><b>10분</b>쯤 걸려요. 실수로 화면이 새로 열려도 이어서 할 수 있어요.</li>
      <li>이름과 답은 어디에도 <b>보내지 않아요.</b> 창을 닫으면 지워져요.</li>
      <li>어려우면 선생님이나 어른께 <b>도와 달라고</b> 해요.</li>
    </ul>
    ${INAPP?'<p class="warn"><b>지금 카카오톡 같은 앱 안에서 열려 있어요.</b> 결과지를 인쇄하거나 저장하려면 '+(IS_ANDROID?'크롬이나 삼성 인터넷':'사파리')+'으로 다시 열어 주세요.</p>':''}
    <p class="muted small">선생님·보호자께: 결과지는 마지막 화면에서 인쇄하거나 PDF·이미지로 저장할 수 있습니다. 학생 자기성찰용 자체 제작 도구이며, 표준화된 심리검사나 진단 도구가 아닙니다. (${VERSION})</p>
    <button class="primary" id="ntcOk">알겠어요</button>
  </div>`;
  document.body.appendChild(d);
  const prev=document.body.style.overflow;document.body.style.overflow='hidden';
  app.setAttribute('aria-hidden','true');
  const ok=d.querySelector('#ntcOk');
  const close=()=>{hush();d.remove();document.body.style.overflow=prev;app.removeAttribute('aria-hidden');const f=document.getElementById('wname');if(f&&matchMedia('(hover:hover)').matches)f.focus();};
  ok.onclick=close;
  d.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const fs=[...d.querySelectorAll('button')];const i=fs.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();fs[fs.length-1].focus();}else if(!e.shiftKey&&i===fs.length-1){e.preventDefault();fs[0].focus();}}});
  const sb=d.querySelector('#ntcSay');if(sb)sb.onclick=()=>say('시작하기 전에 알아 두어요. 시험이 아니에요. 정답도 없어요. 나와 비슷한 얼굴을 누르면 돼요. 십 분쯤 걸려요. 실수로 화면이 새로 열려도 이어서 할 수 있어요. 이름과 답은 어디에도 보내지 않아요. 창을 닫으면 지워져요. 어려우면 선생님이나 어른께 도와 달라고 해요.');
  setTimeout(()=>ok.focus({preventScroll:true}),30);
}
if(location.hash==='#teacher'){state._from=state.step;state.step='teacher';}
if(state.step!=='intro'&&state.step!=='teacher')trap();
render();
if(!restored&&state.step!=='teacher')notice();
})();
